name: publish-reels
on:
  schedule:
    - cron: '5 * * * *'   # 毎時5分（公開リポジトリなら実行時間は無料・無制限）（GitHub の都合で数分〜十数分遅れることがある）
  workflow_dispatch:
    inputs:
      check_only: {description: 'トークン確認だけ（投稿しない）', type: boolean, default: false}
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: pub
        run: python scripts/publish.py
        env:
          IG_TOKEN_OKANE: ${{ secrets.IG_TOKEN_OKANE }}
          IG_USER_ID_OKANE: ${{ secrets.IG_USER_ID_OKANE }}
          IG_TOKEN_TENSHOKU: ${{ secrets.IG_TOKEN_TENSHOKU }}
          IG_USER_ID_TENSHOKU: ${{ secrets.IG_USER_ID_TENSHOKU }}
          IG_TOKEN_TOUSHI: ${{ secrets.IG_TOKEN_TOUSHI }}
          IG_USER_ID_TOUSHI: ${{ secrets.IG_USER_ID_TOUSHI }}
          CHECK_ONLY: ${{ inputs.check_only && '1' || '' }}
      - if: always() && steps.pub.outputs.posted == 'true'
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add -A && git commit -m "posted reels" && git push
